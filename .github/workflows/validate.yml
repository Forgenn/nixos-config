# Evaluates the flake for every host on each PR.
#
# Evaluate, don't build. Every overlay in this repo is commented out
# (hosts/as-pm/overlays.nix -- "Not using overlays currently"), so the fleet is
# stock nixpkgs: `nixos-rebuild build` would only re-download paths the hosts
# fetch from cache.nixos.org themselves, and a binary cache would duplicate
# what cache.nixos.org already is. What a bad flake.lock bump actually breaks
# is evaluation -- a removed module option, a renamed package, a changed
# default -- and that needs no realised closure. Eval is cheap enough to cover
# all seven hosts rather than a sample.
#
# Design: Forgenn/gitops-cluster docs/plans/2026-09-20-fleet-update-automation.md
name: validate

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # flake-check evaluates every nixosConfiguration, so it inherits the
  # known-broken hosts below and cannot pass until they are fixed. Non-blocking
  # for now; flip continue-on-error off once `eval` is green for all seven.
  flake-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check --no-build

  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A non-blocking host still runs and still shows red in the checks list --
    # it just does not gate the merge. The point is that the breakage stays
    # visible and the list shrinks, rather than being hidden behind a skip.
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: dolores, blocking: true }
          - { host: hatsum, blocking: true }
          # Known-broken on main, pre-dating this workflow. Each is a real bug
          # this check surfaced, not a CI problem:
          #   dubois/cuno/katsuragi -- hosts/revachol-cluster/revachol-common.nix
          #     sets `restartTriggers = [ config.system.build.toplevel ]`, which
          #     is infinite recursion: the unit is part of toplevel. The cluster
          #     nodes cannot be rebuilt at all, which is why the 2026-09-08
          #     iscsiadm fix never reached any node.
          #   as-pm -- no bootloader configured anywhere, so the build asserts
          #     "You must set boot.loader.grub.devices". Needs the operator: a
          #     guessed bootloader is how you get an unbootable machine.
          - { host: dubois, blocking: false }
          - { host: cuno, blocking: false }
          - { host: katsuragi, blocking: false }
          - { host: as-pm, blocking: false }
          - { host: t440, blocking: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Evaluate ${{ matrix.host }}
        run: |
          # --show-trace always: this job exists to diagnose, and a truncated
          # trace costs a whole CI round-trip to recover.
          nix eval --raw --show-trace \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath"

  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Deliberately not `needs: eval` -- a non-blocking eval failure would
    # otherwise skip this job, and a skipped check reports as neither success
    # nor failure, which the update-review policy treats as "has not reported".
    continue-on-error: ${{ !matrix.blocking }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # One representative per update track. dubois covers cuno and katsuragi:
        # all three import hosts/revachol-cluster/revachol-common.nix.
        include:
          - { host: dolores, blocking: true }
          - { host: hatsum, blocking: true }
          - { host: dubois, blocking: false }  # see the eval matrix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: What would change on ${{ matrix.host }}
        run: |
          set -uo pipefail
          # --dry-run reports on stderr what it *would* fetch, without fetching.
          # That list names the packages actually moving, which is the review
          # artifact the update-review bot feeds to `claude -p` -- far more
          # readable than a flake.lock hash diff.
          nix build --dry-run \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            2> "dry-run-${{ matrix.host }}.txt"
          status=$?
          cat "dry-run-${{ matrix.host }}.txt"
          exit $status

      - name: Publish the fetch list to the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The <!-- nix-dry-run:HOST --> marker is a contract with the
          # update-review skill's review.py. Do not change it in isolation.
          {
            echo "<!-- nix-dry-run:${{ matrix.host }} -->"
            echo "### \`nix build --dry-run\` — ${{ matrix.host }}"
            echo ''
            echo '```'
            head -c 60000 "dry-run-${{ matrix.host }}.txt"
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
